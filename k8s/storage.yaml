# kind's default storage class ("standard", rancher local-path) binds a PVC
# when the first pod uses it, so each one shows Pending until then.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-data
  namespace: f1
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: f1
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: f1
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
