# Helm values for the official Airflow chart, the only Helm release of the project.
#   helm install airflow apache-airflow/airflow --version 1.22.0 -n f1 -f k8s/airflow/values.yaml
# Chart 1.22.0 deploys Airflow 3.2.2. Every key below was read from `helm show values` of that
# chart; see DECISIONS.md (2026-11-15, SPEC 19, step 8) for why each non-default is here.
# No secret value lives in this file: the Secrets are created by k8s/create-secrets.sh.

defaultAirflowRepository: apache/airflow
defaultAirflowTag: "3.2.2"
airflowVersion: "3.2.2"

# Tasks run inside the scheduler and each one launches its own pod (KubernetesPodOperator).
executor: LocalExecutor

# The scheduler's permission to launch pods is k8s/airflow/rbac.yaml.
allowPodLaunching: false

# External PostgreSQL: the `airflow` database of the pod `postgres`.
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata   # key `connection`, created by create-secrets.sh

# Components that do not fit in 10 GB and are not needed.
triggerer:
  enabled: false
statsd:
  enabled: false
redis:
  enabled: false
webserver:
  enabled: false   # Airflow < 3 only; the UI is the api-server

# DAGs: the ConfigMap `airflow-dags` (generated from dags/ by Kustomize), no git-sync.
volumes:
  - name: dags
    configMap:
      name: airflow-dags
volumeMounts:
  - name: dags
    mountPath: /opt/airflow/dags
    readOnly: true

# The api-server reads the task logs that LocalExecutor writes in the scheduler pod. The PVC is ours
# (k8s/storage.yaml): the one the chart creates asks for an access mode that kind does not support.
logs:
  persistence:
    enabled: true
    existingClaim: airflow-task-logs

# One local admin; the password comes from the Secret `postgres` instead of a value here.
createUserJob:
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres
          key: AIRFLOW_ADMIN_PASSWORD
  args:
    - bash
    - -c
    - |-
      exec airflow users create -r Admin -u admin -e admin@example.com -f admin -l user -p "$AIRFLOW_ADMIN_PASSWORD"
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits: {memory: 512Mi}

migrateDatabaseJob:
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits: {memory: 768Mi}

# Memory budget (see the table of SPEC 19); CPU has requests only, no limits.
apiServer:
  resources:
    requests: {memory: 512Mi, cpu: 100m}
    limits: {memory: 1Gi}

scheduler:
  resources:
    requests: {memory: 512Mi, cpu: 200m}
    # LocalExecutor runs the tasks in this container: 1Gi was OOMKilled by `training` (SPEC 21, DECISIONS.md 2026-11-15).
    limits: {memory: 1536Mi}
  logGroomerSidecar:
    resources:
      requests: {memory: 64Mi, cpu: 10m}
      limits: {memory: 128Mi}

dagProcessor:
  enabled: true
  resources:
    requests: {memory: 384Mi, cpu: 100m}
    limits: {memory: 768Mi}
  logGroomerSidecar:
    resources:
      requests: {memory: 64Mi, cpu: 10m}
      limits: {memory: 128Mi}
