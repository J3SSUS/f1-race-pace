# Publishes the committed `site/` folder on GitHub Pages at every push to main that changes it.
# It runs nothing of the project: `scripts/publish.py` (which needs the anon key) stays a manual step, and this
# workflow only uploads what is already in the repository. Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
