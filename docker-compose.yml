# MLflow now runs in the kind cluster (SPEC 19, see "Kubernetes cluster" in README.md).
# These services are kept STOPPED as a backup of the old data: the volumes `mlflow_db` and
# `mlflow_artifacts` were migrated to the cluster and must not be deleted. Start only `mlflow-db`
# (never `mlflow`, which would write to the old copy) when a migration or a dump needs it:
#   docker compose up -d mlflow-db      and      docker compose stop mlflow-db
services:
  mlflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER} -d ${MLFLOW_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build: ./docker/mlflow
    depends_on:
      mlflow-db:
        condition: service_healthy
    ports:
      - "5001:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    # Artifacts are served by the server, so clients only need HTTP access, not the volume.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/${MLFLOW_DB_NAME}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"

volumes:
  mlflow_db:
  mlflow_artifacts:
